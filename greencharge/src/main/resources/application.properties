# --- Database Configuration (H2 example) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Server & Actuator Ports ---
server.port=8080
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html

# --- Disable Native Hardware Metrics (Crucial for Non-Linux/Dev Machines) ---
# This prevents errors if OpenCL, NUMA, or physical GPU drivers are absent
enact.metrics.enabled=false
enact.metrics.gpu.enabled=false
enact.metrics.opencl.enabled=false

# --- Clean hand-over when the pod is moved ---
# Finish in-flight requests before exiting, and expose separate liveness/readiness probes.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoint.health.probes.enabled=true

# --- ENACT Application Controller ---
server.port=8080
management.server.port=8081

# Redfish (facility/server power monitoring)
redfish.username=admin
redfish.password=password
redfish.base.url=http://localhost:8081
redfish.verify.ssl=false

# SNMP (PDU / facility power)
snmp.community.string=public
snmp.timeout=3000
snmp.retries=2

# Native metrics. Keep disabled on Windows / where GPU/OpenCL is unavailable.
enact.metrics.enabled=false
enact.metrics.opencl.enabled=false
enact.metrics.gpu.enabled=false
# --- end ENACT Application Controller ---
