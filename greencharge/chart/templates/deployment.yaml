apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "greencharge.fullname" . }}
  labels:
    {{- include "greencharge.labels" . | nindent 4 }}
  {{- if .Values.sunflower.enabled }}
  annotations:
    # Opt in to Sunflower: follow the node this RuntimePolicy chooses.
    sunflower.enact.eu/policy: {{ required "sunflower.policy is required when sunflower.enabled" .Values.sunflower.policy | quote }}
  {{- end }}
spec:
  {{- if not .Values.sunflower.enabled }}
  # With Sunflower on, the replica count and node pin belong to the controller, so the
  # chart leaves them out and a later `helm upgrade` cannot undo a move.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Start the new pod before stopping the old one, so a move never leaves zero copies.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "greencharge.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "greencharge.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 40
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: management
              containerPort: 8081
              protocol: TCP
          env:
            # Lets the app report which node and pod answered each request.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.carbonFeed.hostPath }}
            - name: CARBON_FEED_FILE
              value: /grid/{{ .Values.carbonFeed.file }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 1
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
            # Generous on purpose: on a busy laptop a slow answer is not a dead app, and restarting
            # a JVM because the host is busy only makes the host busier.
            timeoutSeconds: 4
            failureThreshold: 6
          lifecycle:
            preStop:
              # Ask the app to hand its clients over before it is stopped; see PlacementInfo.drain.
              httpGet:
                path: /internal/drain?seconds=6
                port: http
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.configMap.enabled }}
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            {{- end }}
            {{- if .Values.carbonFeed.hostPath }}
            - name: carbon-feed
              mountPath: /grid
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.configMap.enabled }}
        - name: config-volume
          configMap:
            name: {{ include "greencharge.fullname" . }}-config
        {{- end }}
        {{- if .Values.carbonFeed.hostPath }}
        - name: carbon-feed
          hostPath:
            path: {{ .Values.carbonFeed.hostPath }}
            type: Directory
        {{- end }}
      {{- if not .Values.sunflower.enabled }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
