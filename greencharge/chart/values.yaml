# Default values for greencharge.
# This is a YAML-formatted file.

replicaCount: 1

image:
  # Built locally (`docker build -t greencharge:1.0 greencharge`) and loaded into Kind,
  # so no registry or pull secret is involved.
  repository: greencharge
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "1.0"

imagePullSecrets: []

# Sunflower follows the node chosen by this RuntimePolicy. When enabled, the chart stops
# setting the replica count and node pin, which the controller then owns.
sunflower:
  enabled: false
  policy: ""

# The carbon feed file delivered by the dataspace transfer. `hostPath` is a folder present
# on every node (see deploy/kind-config.tmpl.yaml); leave it empty to run on the built-in mock.
carbonFeed:
  hostPath: ""
  file: carbon.json
  # What the page's badge says about where the file came from. Leave empty for a file
  # transferred through the dataspace.
  origin: ""
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 8080
  # do not edit the nodePort. Kind is configured to NAT to this nodePort.
  nodePort: 32585

ingress:
  # The cluster has no ingress controller; the Service's NodePort is how the app is reached.
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: greencharge.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: APP_OPEN_BROWSER
    value: "false"

nodeSelector: {}
tolerations: []
affinity: {}

configMap:
  enabled: true
  applicationYaml: |
    server:
      port: 8080
    carbon:
      feed:
        file: "REPLACE_ME"
    app:
      open-browser: false
  applicationProperties: |
    # --- Database Configuration (H2 example) ---
    spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    spring.datasource.driverClassName=org.h2.Driver
    spring.datasource.username=sa
    spring.datasource.password=
    spring.jpa.hibernate.ddl-auto=update
    spring.h2.console.enabled=true
    spring.h2.console.path=/h2-console

    # --- Server & Actuator Ports ---
    server.port=8080
    management.server.port=8081
    management.endpoints.web.exposure.include=health,info,metrics,prometheus

    # --- Swagger UI ---
    springdoc.swagger-ui.path=/swagger-ui.html

    # --- Disable Native Hardware Metrics (Crucial for Non-Linux/Dev Machines) ---
    enact.metrics.enabled=false
    enact.metrics.gpu.enabled=false
    enact.metrics.opencl.enabled=false
