# ENACT Application Controller - Kubernetes additions
#
# Merge the following into your Deployment's container spec and Service.
# The Application Controller exposes an application port and a separate
# management (actuator) port used for health probes.

# --- container ports ---
ports:
  - name: http
    containerPort: 8080
  - name: management
    containerPort: 8081

# --- health probes (Spring Boot Actuator) ---
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: management
  initialDelaySeconds: 30
  periodSeconds: 15
readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: management
  initialDelaySeconds: 20
  periodSeconds: 10

